[package]
name = "ron-forensics"
version = "0.1.0"
edition = "2021"
description = "RON (Real or Not) — off-main-thread forensic signal engine (Boundary ELA + 2D FFT + Bayer dither)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
rustfft = "6.2"
num-complex = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
